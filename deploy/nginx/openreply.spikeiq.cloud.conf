# Host nginx — openreply.spikeiq.cloud → Docker web on 127.0.0.1:3010
# Install:
#   sudo cp deploy/nginx/openreply.spikeiq.cloud.conf /etc/nginx/sites-available/openreply.spikeiq.cloud
#   sudo ln -sf /etc/nginx/sites-available/openreply.spikeiq.cloud /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d openreply.spikeiq.cloud --non-interactive --agree-tos -m admin@spikeiq.cloud --redirect

server {
    listen 80;
    listen [::]:80;
    server_name openreply.spikeiq.cloud;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        client_max_body_size 20m;
    }
}
